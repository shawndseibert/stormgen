<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storm Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
            <div class="title-row">
                    <h1>Storm Generator</h1>
                    <img src="thunderstorm.svg" alt="Thunderstorm Icon" class="storm-icon">
            </div>
        <div class="controls">
            <label>Rain Volume
                <input type="range" id="rainVolume" min="0" max="1" step="0.01" value="0.25">
                <br>
                <button id="birdsMuteBtn" class="birds-mute-btn" style="margin-top:4px; font-size:0.9em; padding:2px 8px;">Mute Birds</button>
            </label>
            <label>Thunder Volume
                <input type="range" id="thunderVolume" min="0" max="1" step="0.01" value="0.5">
            </label>
            <label>Lowpass Filter
                <input type="range" id="lowpassFilter" min="475" max="22050" step="1" value="22050">
                <span id="lowpassLabel">22050 Hz</span>
            </label>
            <label>Thunder Frequency
                <div class="range-group">
                    <label>Min Interval
                        <input type="range" id="thunderMin" min="5" max="60" step="1" value="15">
                    </label>
                    <label>Max Interval
                        <input type="range" id="thunderMax" min="5" max="60" step="1" value="60">
                    </label>
                    <span id="frequencyLabel">15-20s</span>
                </div>
            </label>
        </div>
        <div class="button-row">
            <button id="playBtn">Play Storm</button>
            <button id="stopBtn" disabled>Stop</button>
            <button id="thunderBtn" class="thunder-btn">⚡ Thunder!</button>
            <!-- birdsMuteBtn moved under Rain Volume -->
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
