<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storm Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="title-row">
            <!-- Waveform Visualizer (background layer) -->
            <div id="waveform-container">
                <span class="waveform-label">AUDIO WAVEFORM</span>
                <canvas id="waveform"></canvas>
            </div>
            <h1>Storm Generator</h1>
            <div id="weather-icon" class="weather-icon">☀️</div>
        </div>
        

        
        <!-- Music Playback Controls -->
        <div class="music-player-wrapper">
            <div class="standalone-panel music-player-panel">
                
                <details>
                    <summary>
                        <span class="summary-track-info">
                            <span id="summary-track-name">No track loaded</span>
                        </span>
                    </summary>
                    <div id="music-playback-section">
                    <!-- Collapsible content (track display and volume) -->
                    <div class="music-expanded-content">
                        <div id="track-display-container">
                            <div id="current-track-display">
                                <span class="track-label">NOW PLAYING</span>
                                <span class="track-name">No track loaded</span>
                            </div>
                            <div id="next-track-display">
                                <span class="track-label">UP NEXT</span>
                                <span class="track-name"></span>
                            </div>
                        </div>
                        
                        <!-- Music Playlist (nested dropdown) -->
                        <details class="nested-panel">
                            <summary>Music Playlist</summary>
                            <div id="playlist-section">
                                <div id="playlist-upload">
                                    <input type="file" id="musicUpload" accept="audio/mp3,audio/mpeg" multiple style="display:none;">
                                    <button id="uploadMusicBtn" class="upload-btn">📁 Upload MP3</button>
                                    <button id="clearPlaylistBtn" class="clear-playlist-btn">🗑️ Clear All</button>
                                </div>
                                <div id="playlist-container">
                                    <div id="playlist-items"></div>
                                </div>
                            </div>
                            
                            <!-- Crossfade Control -->
                            <div id="crossfade-section">
                                <label for="crossfadeDuration">Crossfade Duration
                                    <input type="range" id="crossfadeDuration" min="0" max="60" step="0.5" value="25">
                                    <span id="crossfadeDurationLabel">25.0s</span>
                                </label>
                            </div>
                        </details>
                    </div>
                </div>
            </details>
            
            <!-- Always visible controls (inside panel border) -->
            <div id="music-controls-always-visible">
                <!-- Music Volume Slider -->
                <div id="music-volume-section">
                    <label for="musicVolume">
                        <div>Music Volume</div>
                        <div style="text-align: right;"><span id="musicVolumeLabel">100</span></div>
                    </label>
                    <input type="range" id="musicVolume" min="0" max="100" value="100">
                </div>
                
                <!-- Playback Controls -->
                <div id="music-controls-row">
                    <button id="musicPlayPauseBtn">▶ Play</button>
                    <button id="musicStopBtn">⏹ Stop</button>
                    <button id="musicPrevBtn">⏮ Prev</button>
                    <button id="musicNextBtn">⏭ Next</button>
                </div>
                
                <!-- Track Position Slider -->
                <div id="track-position-section">
                    <input type="range" id="trackPosition" min="0" max="100" value="0" step="0.1">
                    <div id="track-time">
                        <span id="currentTime">0:00</span>
                        <span id="totalTime">0:00</span>
                    </div>
                </div>
            </div>
            </div> <!-- End standalone-panel -->
        </div> <!-- End music-player-wrapper -->
        
        <div class="controls">
            
            <!-- Settings Panel -->
            <details id="settings-panel">
                <summary>Settings</summary>
                <div id="settings-controls">
                    <!-- Theme Sub-Panel -->
                    <details class="nested-panel">
                        <summary>Theme</summary>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;">
                            <div>
                                <label style="font-size: 0.85em; margin-bottom: 4px; display: block;">Primary<br><span style="font-size: 0.8em; opacity: 0.7; text-transform: none;">(borders)</span></label>
                                <input type="color" id="theme-color-picker" value="#888888" style="width: 100%; height: 60px; cursor: pointer; border: 2px solid var(--secondary-accent); border-radius: 4px; background: rgba(0, 0, 0, 0.5);">
                            </div>
                            <div>
                                <label style="font-size: 0.85em; margin-bottom: 4px; display: block;">Secondary<br><span style="font-size: 0.8em; opacity: 0.7; text-transform: none;">(UI & text)</span></label>
                                <input type="color" id="secondary-color-picker" value="#aaaaaa" style="width: 100%; height: 60px; cursor: pointer; border: 2px solid var(--secondary-accent); border-radius: 4px; background: rgba(0, 0, 0, 0.5);">
                            </div>
                        </div>
                        <div>
                            <label style="font-size: 0.85em; margin-bottom: 6px; display: block;">Glow Intensity</label>
                            <input type="range" id="glow-intensity" min="0" max="2" step="0.1" value="1" style="width: 100%;">
                            <div style="display: flex; justify-content: space-between; font-size: 0.75em; opacity: 0.6; margin-top: 4px;">
                                <span>Off</span>
                                <span>Normal</span>
                                <span>Max</span>
                            </div>
                        </div>
                    </details>
                    
                    <!-- Storm Environment Sub-Panel -->
                    <details class="nested-panel">
                        <summary>Storm Environment</summary>
                        <div id="environment-controls">
                            <!-- Storm Presets -->
                            <div class="preset-buttons">
                                <button class="preset-btn" id="presetIndoorCozy">🏠 Indoor Cozy</button>
                                <button class="preset-btn" id="presetOutdoor">🌳 Outdoor</button>
                            </div>
                            
                            <!-- Custom Preset Management -->
                            <div id="custom-preset-section" style="margin-top: 12px;">
                                <label>Custom Presets</label>
                                <div style="display: flex; gap: 8px; margin-top: 8px;">
                                    <input type="text" id="customPresetName" placeholder="Preset name..." style="flex: 1; padding: 6px; background: rgba(0, 0, 0, 0.8); border: 1px solid var(--theme-color); color: var(--theme-color); border-radius: 4px; font-family: 'Share Tech Mono', monospace;">
                                    <button id="savePresetBtn" class="preset-btn" style="flex-shrink: 0;">💾 Save</button>
                                </div>
                                <div id="customPresetsContainer" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;"></div>
                            </div>
                            
                            <!-- Global Audio Filter -->
                            <label style="margin-top: 12px;">Global Lowpass Filter
                                <input type="range" id="lowpassFilter" min="420" max="22050" step="1" value="22050">
                                <span id="lowpassLabel">22050 Hz</span>
                            </label>
                            
                            <!-- Rain Options -->
                            <label style="margin-top: 12px;">Rain Volume
                                <input type="range" id="rainVolume" min="0" max="1" step="0.01" value="0">
                            </label>
                            <label for="rainReverb">Rain Reverb Mix
                                <input type="range" id="rainReverb" min="0" max="1" step="0.01" value="0">
                                <span id="rainReverbLabel">0.00</span>
                            </label>
                            
                            <!-- Thunder Options -->
                            <div class="thunder-options-label" style="margin-top: 16px;">
                                <label>Thunder Volume
                                    <input type="range" id="thunderVolume" min="0" max="1" step="0.01" value="1">
                                </label>
                                <label for="thunderReverb">Thunder Reverb Mix
                                    <input type="range" id="thunderReverb" min="0" max="1" step="0.01" value="0">
                                    <span id="thunderReverbLabel">0.00</span>
                                </label>
                                <div class="thunder-options-frequency">
                                    <label>Thunder Frequency</label>
                                    <label>Min Interval
                                        <input type="range" id="thunderMin" min="5" max="60" step="1" value="5">
                                    </label>
                                    <label>Max Interval
                                        <input type="range" id="thunderMax" min="5" max="60" step="1" value="60">
                                    </label>
                                    <span id="frequencyLabel">5-60s</span>
                                </div>
                            </div>
                            
                            <!-- Birds Control -->
                            <button id="birdsMuteBtn" class="birds-mute-btn" style="margin-top:16px; font-size:0.98em; padding:8px 18px; width:100%;">Mute Birds</button>
                        </div>
                    </details>
                    
                    <!-- Audio Effects & EQ Sub-Panel -->
                    <details class="nested-panel">
                        <summary>Audio Effects & EQ</summary>
                        <div id="audio-effects-controls">
                            <label for="musicReverb">Music Reverb Mix
                                <input type="range" id="musicReverb" min="0" max="1" step="0.01" value="0.3">
                                <span id="musicReverbLabel">0.3</span>
                            </label>
                            
                            <label for="musicLowpass">Music Lowpass Filter
                                <input type="range" id="musicLowpass" min="420" max="22050" step="1" value="22050">
                                <span id="musicLowpassLabel">22050 Hz</span>
                            </label>
                            <label for="musicRoomSize">Room Size
                                <input type="range" id="musicRoomSize" min="0.001" max="0.10" step="0.001" value="0.02">
                                <span id="musicRoomSizeLabel">0.020</span>
                            </label>
                            
                            <!-- Radio EQ Presets -->
                            <div id="radio-eq-presets">
                                <label>Radio Presets</label>
                                <div class="radio-preset-buttons">
                                    <button class="radio-preset-btn" data-preset="modern">Modern</button>
                                    <button class="radio-preset-btn" data-preset="vintage">Vintage Radio</button>
                                    <button class="radio-preset-btn" data-preset="am">AM Radio</button>
                                    <button class="radio-preset-btn" data-preset="gramophone">Gramophone</button>
                                </div>
                            </div>
                            
                            <!-- Radio EQ Controls -->
                            <div id="radio-eq-controls">
                                <label for="eqBass">Bass
                                    <input type="range" id="eqBass" min="-12" max="12" step="0.5" value="0">
                                    <span id="eqBassLabel">0 dB</span>
                                </label>
                                <label for="eqMidBass">Mid-Bass
                                    <input type="range" id="eqMidBass" min="-12" max="12" step="0.5" value="0">
                                    <span id="eqMidBassLabel">0 dB</span>
                                </label>
                                <label for="eqMid">Mid
                                    <input type="range" id="eqMid" min="-12" max="12" step="0.5" value="0">
                                    <span id="eqMidLabel">0 dB</span>
                                </label>
                                <label for="eqMidTreble">Mid-Treble
                                    <input type="range" id="eqMidTreble" min="-12" max="12" step="0.5" value="0">
                                    <span id="eqMidTrebleLabel">0 dB</span>
                                </label>
                                <label for="eqTreble">Treble
                                    <input type="range" id="eqTreble" min="-12" max="12" step="0.5" value="0">
                                    <span id="eqTrebleLabel">0 dB</span>
                                </label>
                            </div>
                        </div>
                    </details>
                    
                    <!-- OSC (Oscilloscope) Sub-Panel -->
                    <details class="nested-panel" id="osc-panel">
                        <summary>OSC (Oscilloscope)</summary>
                        <div id="osc-controls">
                            <!-- Waveform Display Mode -->
                            <label>Display Mode</label>
                            <div class="osc-mode-buttons">
                                <button class="osc-mode-btn active" data-mode="waveform">Waveform</button>
                                <button class="osc-mode-btn" data-mode="bars">Bars</button>
                                <button class="osc-mode-btn" data-mode="circular">Circular</button>
                                <button class="osc-mode-btn" data-mode="radial">Radial Spokes</button>
                                <button class="osc-mode-btn" data-mode="polygon">Polygon Burst</button>
                            </div>
                            
                            <!-- Line Width -->
                            <label for="oscLineWidth">Line Width
                                <input type="range" id="oscLineWidth" min="1" max="10" step="0.5" value="2">
                                <span id="oscLineWidthLabel">2</span>
                            </label>
                            
                            <!-- Glow/Shadow Blur -->
                            <label for="oscGlowIntensity">Glow Intensity
                                <input type="range" id="oscGlowIntensity" min="0" max="30" step="1" value="10">
                                <span id="oscGlowIntensityLabel">10</span>
                            </label>
                            
                            <!-- Amplification -->
                            <label for="oscAmplification">Amplification
                                <input type="range" id="oscAmplification" min="0.5" max="5" step="0.1" value="1">
                                <span id="oscAmplificationLabel">1.0x</span>
                            </label>
                            
                            <!-- Smoothing -->
                            <label for="oscSmoothing">Smoothing
                                <input type="range" id="oscSmoothing" min="0" max="0.99" step="0.01" value="0.8">
                                <span id="oscSmoothingLabel">0.80</span>
                            </label>
                            
                            <!-- FFT Size -->
                            <label for="oscFFTSize">Resolution (FFT)
                                <input type="range" id="oscFFTSize" min="5" max="13" step="1" value="11">
                                <span id="oscFFTSizeLabel">2048</span>
                            </label>
                            
                            <!-- Color Picker -->
                            <label for="oscColor">Waveform Color
                                <input type="color" id="oscColor" value="#aaaaaa">
                            </label>
                            
                            <!-- Background Color -->
                            <label for="oscBgColor">Background Color
                                <input type="color" id="oscBgColor" value="#000a05">
                            </label>
                            
                            <!-- Waveform Opacity -->
                            <label for="oscOpacity">Waveform Visibility
                                <input type="range" id="oscOpacity" min="0" max="1" step="0.05" value="0.5">
                                <span id="oscOpacityLabel">50%</span>
                            </label>
                            
                            <!-- Title Visibility -->
                            <label for="oscTitleOpacity">Title Visibility
                                <input type="range" id="oscTitleOpacity" min="0" max="1" step="0.05" value="1">
                                <span id="oscTitleOpacityLabel">100%</span>
                            </label>
                            
                            <!-- Fade Trail Effect -->
                            <label for="oscFadeTrail">Trail Effect
                                <input type="range" id="oscFadeTrail" min="0" max="1" step="0.05" value="0">
                                <span id="oscFadeTrailLabel">Off</span>
                            </label>
                            
                            <!-- Mirror Effect -->
                            <label>
                                <input type="checkbox" id="oscMirror">
                                Mirror Effect
                            </label>
                            
                            <!-- Fill Under Wave -->
                            <label>
                                <input type="checkbox" id="oscFill">
                                Fill Under Wave
                            </label>
                            
                            <!-- Lightning Effect Mode -->
                            <label>Lightning Effect
                                <select id="oscLightningMode" style="margin-left: 4px; padding: 4px 8px; background: rgba(0, 0, 0, 0.8); border: 1px solid var(--theme-color); color: var(--secondary-accent); border-radius: 3px; font-family: 'Share Tech Mono', monospace; cursor: pointer;">
                                    <option value="off">Off</option>
                                    <option value="outline">Outline (Behind)</option>
                                    <option value="outline-long">Outline (Behind) - Long Fade</option>
                                    <option value="invert">Invert (Front)</option>
                                    <option value="invert-long">Invert (Front) - Long Fade</option>
                                    <option value="bright">Bright Flash (Front)</option>
                                    <option value="bright-long">Bright Flash (Front) - Long Fade</option>
                                    <option value="bright-back" selected>Bright Flash (Back)</option>
                                    <option value="bright-back-long">Bright Flash (Back) - Long Fade</option>
                                </select>
                            </label>
                            
                            <!-- Dots Mode -->
                            <label>
                                <input type="checkbox" id="oscDots">
                                Dots Mode
                            </label>
                        </div>
                    </details>
                </div>
            </details>
            
            <!-- Start Storm Button -->
            <button id="stormToggleBtn" style="width:100%;height:48px;margin-top:12px;">Start Storm</button>

        </div>
    </div>
    <style>
    .storm-icon.active {
        filter: brightness(2) drop-shadow(0 0 10px yellow);
        transition: filter 0.2s;
    }
    </style>
    <script src="app.js"></script>
    <script>
    // Collapsible panels state persistence
    document.addEventListener('DOMContentLoaded', function() {
        // Handle .controls details panels
        const controlPanels = document.querySelectorAll('.controls details');
        controlPanels.forEach((panel, idx) => {
            const key = 'stormgen_panel_' + idx;
            
            // Restore state from localStorage, all default to closed
            const saved = localStorage.getItem(key);
            if (saved === 'open') {
                panel.open = true;
            } else {
                panel.open = false;
            }
            
            // Listen for toggle events
            panel.addEventListener('toggle', function() {
                localStorage.setItem(key, panel.open ? 'open' : 'closed');
            });
        });
        
        // Handle standalone panels (Music Player, OSC, Music Playlist)
        const standalonePanels = document.querySelectorAll('details.standalone-panel');
        standalonePanels.forEach((panel, idx) => {
            const key = 'stormgen_standalone_' + idx;
            
            // Restore state from localStorage
            const saved = localStorage.getItem(key);
            if (saved === 'open') {
                panel.open = true;
            } else if (saved === 'closed') {
                panel.open = false;
            }
            // If no saved state, keep the default from HTML (music player defaults to open)
            
            // Listen for toggle events
            panel.addEventListener('toggle', function() {
                localStorage.setItem(key, panel.open ? 'open' : 'closed');
            });
        });
    });
    </script>
</body>
</html>
