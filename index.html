<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storm Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
            <div class="title-row">
                    <h1>Storm Generator</h1>
                    <img src="thunderstorm.svg" alt="Thunderstorm Icon" class="storm-icon">
            </div>
        <div class="controls">
            <details open>
                <summary>Rain Options</summary>
                <label>Rain Volume
                    <input type="range" id="rainVolume" min="0" max="1" step="0.01" value="0.25">
                </label>
            </details>
            <details open>
                <summary>Thunder Options</summary>
                <div class="thunder-options-label">
                    <label>Thunder Volume
                        <input type="range" id="thunderVolume" min="0" max="1" step="0.01" value="0.5">
                    </label>
                    <div class="thunder-options-frequency">
                        <label>Thunder Frequency</label>
                        <label>Min Interval
                            <input type="range" id="thunderMin" min="5" max="60" step="1" value="15">
                        </label>
                        <label>Max Interval
                            <input type="range" id="thunderMax" min="5" max="60" step="1" value="60">
                        </label>
                        <span id="frequencyLabel">15-20s</span>
                    </div>
                </div>
            </details>
            <details open>
                <summary>Audio Filter</summary>
                <label>Lowpass Filter
                    <input type="range" id="lowpassFilter" min="420" max="22050" step="1" value="22050">
                    <span id="lowpassLabel">22050 Hz</span>
                </label>
            </details>
            <details open>
                <summary>Sounds</summary>
                <button id="birdsMuteBtn" class="birds-mute-btn" style="margin-top:4px; font-size:0.98em; padding:8px 18px; width:100%;">Mute Birds</button>
            </details>
            <details open>
                <summary>Music</summary>
                <div id="music-controls">
                    <div id="music-controls-row">
                        <button id="musicPlayBtn">Play</button>
                        <button id="musicPauseBtn">Pause</button>
                        <button id="musicStopBtn">Stop</button>
                    </div>
                    <label for="musicVolume">Music Volume
                        <input type="range" id="musicVolume" min="0" max="100" value="50">
                    </label>
                </div>
            </details>
            <details open>
                <summary>YouTube Link</summary>
                <div id="youtube-link-area" style="margin-bottom:8px;">
                    <input type="text" id="ytLinkInput" placeholder="Paste YouTube URL here" style="width:220px;" value="https://youtu.be/4unfhTQDs2g">
                    <button id="ytLoadBtn">Load Video</button>
                </div>
                <div style="display:none;">
                    <div id="ytPlayer"></div>
                </div>
            </details>
        </div>
        <div class="button-row">
            <button id="playBtn">Play Storm</button>
            <button id="stopBtn" disabled>Stop</button>
            <button id="thunderBtn" class="thunder-btn">⚡ Thunder!</button>
            <!-- birdsMuteBtn moved under Rain Volume -->
        </div>
    </div>
    <script src="app.js"></script>
    <script>
    // Collapsible panels state persistence
    document.addEventListener('DOMContentLoaded', function() {
        const detailsPanels = document.querySelectorAll('.controls details');
        detailsPanels.forEach((panel, idx) => {
            const key = 'stormgen_panel_' + idx;
            // Restore state from localStorage
            const saved = localStorage.getItem(key);
            if (saved === 'open') {
                panel.open = true;
            } else {
                panel.open = false;
            }
            // Listen for toggle events
            panel.addEventListener('toggle', function() {
                localStorage.setItem(key, panel.open ? 'open' : 'closed');
            });
        });
    });
    </script>
</body>
</html>
