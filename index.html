<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storm Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
            <div class="title-row">
                    <h1>Storm Generator</h1>
                    <img src="thunderstorm.svg" alt="Thunderstorm Icon" class="storm-icon">
            </div>
        <div class="controls">
            <!-- YouTube Link Input -->
            <div id="youtube-link-area" style="margin-bottom:8px;">
                <label for="ytLinkInput">YouTube Link:</label>
                <input type="text" id="ytLinkInput" placeholder="Paste YouTube URL here" style="width:220px;" value="https://youtu.be/4unfhTQDs2g">
                <button id="ytLoadBtn">Load Video</button>
            </div>
            <!-- Hidden YouTube Player Controls -->
            <div id="youtube-controls" style="margin-bottom:12px;">
                <button id="ytPlayBtn">Play</button>
                <button id="ytPauseBtn">Pause</button>
                <button id="ytStopBtn">Stop</button>
                <label style="margin-left:8px;">YouTube Volume
                    <input type="range" id="ytVolume" min="0" max="100" value="50" style="width:100px;">
                </label>
            </div>
            <div style="display:none;">
                <div id="ytPlayer"></div>
            </div>
            <label>Rain Volume
                <input type="range" id="rainVolume" min="0" max="1" step="0.01" value="0.25">
                <br>
                <button id="birdsMuteBtn" class="birds-mute-btn" style="margin-top:4px; font-size:0.9em; padding:2px 8px;">Mute Birds</button>
            </label>
            <label>Thunder Volume
                <input type="range" id="thunderVolume" min="0" max="1" step="0.01" value="0.5">
            </label>
            <label>Lowpass Filter
                <input type="range" id="lowpassFilter" min="420" max="22050" step="1" value="22050">
                <span id="lowpassLabel">22050 Hz</span>
            </label>
            <label>Thunder Frequency
                <div class="range-group">
                    <label>Min Interval
                        <input type="range" id="thunderMin" min="5" max="60" step="1" value="15">
                    </label>
                    <label>Max Interval
                        <input type="range" id="thunderMax" min="5" max="60" step="1" value="60">
                    </label>
                    <span id="frequencyLabel">15-20s</span>
                </div>
            </label>
        </div>
        <div class="button-row">
            <button id="playBtn">Play Storm</button>
            <button id="stopBtn" disabled>Stop</button>
            <button id="thunderBtn" class="thunder-btn">⚡ Thunder!</button>
            <!-- birdsMuteBtn moved under Rain Volume -->
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
